[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stablecard-rail-backend"
version = "0.1.0"
description = "Sandbox-scale card funding pipeline: Solana USDC -> bridge -> virtual card top-up"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0.1",
    # Runtime from phase 3: the Lithic adapter makes real HTTP calls. SPEC.md §2
    # names no HTTP client, but it does require real provider calls in §3.2 —
    # see docs/ARCHITECTURE.md §4.3.
    "httpx>=0.27",
    # Ed25519, for the Gnosis Pay webhook scheme. Their signatures are asymmetric
    # and the standard library has no Ed25519, so verifying the scheme they
    # actually document is not possible without this (docs/ARCHITECTURE.md §7.3).
    "cryptography>=42",
    # Solana keys and signatures, named in SPEC.md §2. Only `solders` and not
    # `solana-py`: the RPC surface the watcher needs is two methods over the
    # `httpx` already here, and writing them keeps the whole thing testable by
    # replaying recorded responses (docs/ARCHITECTURE.md §9.14).
    "solders>=0.21",
    # Phase 6. A lock-and-mint bridge leaves the destination leg to us, so this
    # service signs and sends a transaction on an EVM chain — secp256k1 with a
    # recovery id, keccak-256, and RLP, none of which `cryptography` provides.
    # Approved by jp when the destination-leg question was put to them; the
    # alternative was a route nobody redeems (docs/ARCHITECTURE.md §10.2).
    # `eth-account` and not `web3.py`: the RPC surface is five methods over the
    # `httpx` already here, which is §4.3's argument unchanged.
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# B008: fixture defaults. SIM300: `assert EXPECTED == actual` reads correctly in
# a test even though ruff calls it a Yoda condition.
"tests/*" = ["B008", "SIM300"]

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "scripts", "tests"]
exclude = "alembic/versions"

[[tool.mypy.overrides]]
# Test bodies use fixtures whose types come from pytest-asyncio at runtime;
# keep strict typing on the app, pragmatic typing on assertions.
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

# -------------------------------------------------------------- coverage ----
# SPEC.md §10: gate >= 60% on funding/, webhooks/, issuers/, ledger/.
# Only the packages that exist in the current phase are listed here; each phase
# adds its own package as it lands.
[tool.coverage.run]
branch = true
# SQLAlchemy's async layer runs sync DBAPI work in a greenlet, so a line
# executed while a greenlet is switched in is invisible to the default tracer.
# Without this, `except IntegrityError` handlers reached from an awaited query
# read as dead code — verified by making one raise and watching tests fail.
concurrency = ["greenlet", "thread"]
source = ["app/chain", "app/funding", "app/issuers", "app/ledger", "app/webhooks"]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
