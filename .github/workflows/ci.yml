name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stablecard
          POSTGRES_PASSWORD: stablecard
          POSTGRES_DB: stablecard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stablecard -d stablecard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite derives its own `*_test` database from this URL and creates it.
      DATABASE_URL: postgresql+asyncpg://stablecard:stablecard@localhost:5432/stablecard
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Tests + coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn

  mobile:
    name: mobile (types, tests, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      # Every suite runs once per platform (jest-expo's multi-project preset), so
      # this covers the three secure-storage backends rather than whichever one the
      # runner happens to resolve.
      - name: Tests
        run: npm run test:ci

      # The Vercel deliverable, built here so a broken static export fails in CI
      # rather than on a deploy. Demo mode, because CI has no backend — and that is
      # the build a stranger clicking the link gets.
      - name: Web build
        run: npm run build:web
        env:
          EXPO_PUBLIC_DEMO: "1"

      # Not `if: always()`: when an earlier step fails there is no `dist` to upload,
      # and the missing-path warning is an annotation on a run that already has a
      # real failure to read.
      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: mobile/dist
          if-no-files-found: warn
